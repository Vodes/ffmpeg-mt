name: build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      nonfree:
        description: Enable the nonfree build profile
        type: boolean
        default: false
      release:
        description: Publish a versioned GitHub release after all builds pass
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
            container: true
            image_stage: linux_builder
            image_name: manylinux_2_34_x86_64
            base_image: quay.io/pypa/manylinux_2_34_x86_64@sha256:0b4acc5b3c4c797bb9a6286c4d15039962f61ee0c5426753afd5cbe45baebfc4
          - target: windows-x86_64
            runner: ubuntu-24.04
            container: true
            image_stage: builder
            image_name: manylinux_2_34_x86_64
            base_image: quay.io/pypa/manylinux_2_34_x86_64@sha256:0b4acc5b3c4c797bb9a6286c4d15039962f61ee0c5426753afd5cbe45baebfc4
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            container: true
            image_stage: linux_builder
            image_name: manylinux_2_34_aarch64
            base_image: quay.io/pypa/manylinux_2_34_aarch64@sha256:db1a485b015c1d9a6d7e2929367a69a6f772964be06cca8fe585f959a47ec0b7
          - target: windows-arm64
            runner: ubuntu-24.04-arm
            container: true
            image_stage: builder
            image_name: manylinux_2_34_aarch64
            base_image: quay.io/pypa/manylinux_2_34_aarch64@sha256:db1a485b015c1d9a6d7e2929367a69a6f772964be06cca8fe585f959a47ec0b7
          - target: macos-arm64
            runner: macos-15
            container: false
            image_name: native
    name: build (${{ matrix.target }}, ${{ matrix.image_name }} on ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: actions/cache@v6.1.0
        with:
          path: .cache/downloads
          key: sources-${{ hashFiles('sources.lock.toml') }}
      - uses: actions/cache@v6.1.0
        with:
          path: |
            .cache/ccache
            .cache/cargo
          key: ccache-${{ matrix.target }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.target }}-
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: ${{ matrix.container }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: ${{ matrix.container }}
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.image_stage }}
          tags: ffmpeg-mt-builder:manylinux_2_34
          load: true
          build-args: MANYLINUX_IMAGE=${{ matrix.base_image }}
          cache-from: type=gha,scope=builder-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=builder-${{ runner.arch }}
      - name: Install macOS build tools
        if: ${{ !matrix.container }}
        run: brew install autoconf automake cargo-c ccache cmake libtool nasm ninja pkg-config rust shaderc zstd
      - name: Build in manylinux_2_34
        if: ${{ matrix.container }}
        env:
          FFMPEG_MT_SKIP_IMAGE_BUILD: "1"
        run: >-
          uv run python build.py ${{ matrix.target }} --clean
          ${{ inputs.nonfree && '--nonfree' || '' }}
      - name: Build on macOS
        if: ${{ !matrix.container }}
        run: >-
          uv run python build.py ${{ matrix.target }} --clean
          ${{ inputs.nonfree && '--nonfree' || '' }}
      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ffmpeg-${{ matrix.target }}${{ inputs.nonfree && '-nonfree' || '' }}
          path: dist/*

  windows-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            runner: windows-2025
          - target: windows-arm64
            runner: windows-11-vs2026-arm
    name: smoke (${{ matrix.target }} on ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ffmpeg-${{ matrix.target }}${{ inputs.nonfree && '-nonfree' || '' }}
          path: artifact
      - name: Extract artifact
        shell: pwsh
        run: |
          $archive = Get-ChildItem -Path artifact -Filter '*.tar.zst' -File | Select-Object -First 1
          if ($null -eq $archive) {
            throw 'The build artifact does not contain a .tar.zst archive.'
          }

          $extract = Join-Path $PWD 'package'
          New-Item -ItemType Directory -Path $extract | Out-Null
          $tar = Join-Path $extract $archive.BaseName

          if ($null -eq (Get-Command zstd.exe -ErrorAction SilentlyContinue)) {
            throw 'zstd is required to extract the build artifact.'
          }
          if ($null -eq (Get-Command tar.exe -ErrorAction SilentlyContinue)) {
            throw 'tar is required to extract the build artifact.'
          }

          & zstd.exe -d -f $archive.FullName -o $tar
          if ($LASTEXITCODE -ne 0) {
            throw "zstd failed with exit code $LASTEXITCODE."
          }
          & tar.exe -xf $tar -C $extract
          if ($LASTEXITCODE -ne 0) {
            throw "tar failed with exit code $LASTEXITCODE."
          }

          $ffmpeg = Get-ChildItem -Path $extract -Filter 'ffmpeg.exe' -File -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $extract -Filter 'ffprobe.exe' -File -Recurse | Select-Object -First 1
          if ($null -eq $ffmpeg -or $null -eq $ffprobe) {
            throw 'The extracted artifact does not contain ffmpeg.exe and ffprobe.exe.'
          }
          "FFMPEG_BIN=$($ffmpeg.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Inspect native build
        shell: pwsh
        run: |
          & "$env:FFMPEG_BIN\ffmpeg.exe" -version
          if ($LASTEXITCODE -ne 0) {
            throw "ffmpeg -version failed with exit code $LASTEXITCODE."
          }
          & "$env:FFMPEG_BIN\ffmpeg.exe" -codecs
          if ($LASTEXITCODE -ne 0) {
            throw "ffmpeg -codecs failed with exit code $LASTEXITCODE."
          }
          & "$env:FFMPEG_BIN\ffmpeg.exe" -hwaccels
          if ($LASTEXITCODE -ne 0) {
            throw "ffmpeg -hwaccels failed with exit code $LASTEXITCODE."
          }
          & "$env:FFMPEG_BIN\ffmpeg.exe" -protocols
          if ($LASTEXITCODE -ne 0) {
            throw "ffmpeg -protocols failed with exit code $LASTEXITCODE."
          }
          & "$env:FFMPEG_BIN\ffprobe.exe" -version
          if ($LASTEXITCODE -ne 0) {
            throw "ffprobe -version failed with exit code $LASTEXITCODE."
          }
      - name: Encode and probe a sample
        shell: pwsh
        run: |
          $sample = Join-Path $env:RUNNER_TEMP 'smoke.mkv'
          & "$env:FFMPEG_BIN\ffmpeg.exe" `
            -hide_banner -loglevel error `
            -f lavfi -i 'testsrc2=duration=1:size=128x72:rate=10' `
            -f lavfi -i 'sine=frequency=1000:duration=1' `
            -c:v mpeg4 -c:a aac -y $sample
          if ($LASTEXITCODE -ne 0) {
            throw "ffmpeg smoke encode failed with exit code $LASTEXITCODE."
          }

          $probe = & "$env:FFMPEG_BIN\ffprobe.exe" `
            -v error -show_streams -of json $sample | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "ffprobe smoke inspection failed with exit code $LASTEXITCODE."
          }
          $types = @((ConvertFrom-Json $probe).streams | ForEach-Object { $_.codec_type })
          if ($types -notcontains 'video' -or $types -notcontains 'audio') {
            throw "ffprobe did not report both audio and video streams: $probe"
          }

  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    needs: [build, windows-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: ffmpeg-*
          path: dist
          merge-multiple: true
      - run: uv run python scripts/source_archive.py
      - name: Create versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(uv run python -c 'import tomllib; print(tomllib.load(open("sources.lock.toml", "rb"))["sources"]["ffmpeg"]["version"])')
          REVISION=$(uv run python -c 'import tomllib; print(tomllib.load(open("sources.lock.toml", "rb"))["build"]["revision"])')
          PROFILE_SUFFIX="${{ inputs.nonfree && '-nonfree' || '' }}"
          TAG="v${VERSION}-r${REVISION}${PROFILE_SUFFIX}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            exit 0
          fi
          gh release create "$TAG" dist/* --generate-notes
