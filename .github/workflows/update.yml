name: update-ffmpeg

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - run: uv run python scripts/update_ffmpeg.py
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/update-ffmpeg
          delete-branch: true
          commit-message: "build: update stable FFmpeg pin"
          title: "build: update stable FFmpeg pin"
          body: "Updates to the highest signed stable archive and resets the build revision. The full target matrix runs on this PR."
