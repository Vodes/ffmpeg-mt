name: update-ffmpeg

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - run: uv run python -m scripts.update_ffmpeg
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: automation/update-ffmpeg
          delete-branch: true
          commit-message: "build: update stable FFmpeg pin"
          title: "build: update stable FFmpeg pin"
          body: "Updates to the highest signed stable archive and resets the build revision. The full target matrix runs on this PR."
