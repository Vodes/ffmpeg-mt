[project]
name = "ffmpeg-mt"
version = "0.1.0"
description = "Reproducible static FFmpeg release builds"
requires-python = "~=3.12.0"
dependencies = [
  "meson>=1.8,<2; sys_platform == 'darwin'",
  "niquests>=3.21,<4",
  "packaging>=25,<27",
  "tomlkit>=0.13.3,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["build.py", "ffbuild", "scripts"]
