[binaries]
c = ['ccache', '/opt/llvm-mingw/bin/aarch64-w64-mingw32-clang']
cpp = ['ccache', '/opt/llvm-mingw/bin/aarch64-w64-mingw32-clang++']
ar = '/opt/llvm-mingw/bin/aarch64-w64-mingw32-ar'
strip = '/opt/llvm-mingw/bin/aarch64-w64-mingw32-strip'
windres = '/opt/llvm-mingw/bin/aarch64-w64-mingw32-windres'
pkg-config = 'pkg-config'

[host_machine]
system = 'windows'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[properties]
needs_exe_wrapper = true
